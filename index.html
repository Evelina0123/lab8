<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лабораторная работа 8 — Форма обратной связи</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">

  <header class="site-header py-3 shadow-sm">
    <div class="container">
      <div class="d-flex flex-column flex-md-row align-items-center gap-3">
        <img id="logo" src="logo.png.png" alt="Логотип" width="80" height="80">
        <h1 class="site-title h2 m-0 text-center text-md-start">Лабораторная работа 8</h1>
      </div>
    </div>
  </header>

  <main class="container flex-grow-1 py-4">
    <section class="content-block p-3 p-md-4 rounded shadow-sm mx-auto contact-block">
      <h2 class="section-title pb-2 mb-3">Обратная связь</h2>
      <p>Есть вопрос или предложение? Нажмите на кнопку, заполните форму, и сообщение придёт на почту автору сайта.</p>
      <button type="button" id="open-form" class="btn btn-save px-4 py-2">Написать нам</button>
    </section>
  </main>

  <div id="popup" class="popup-overlay" hidden>
    <div class="popup-box content-block rounded shadow p-3" role="dialog"
         aria-modal="true" aria-labelledby="popup-title" tabindex="-1">

      <div class="d-flex justify-content-between align-items-start mb-2">
        <h2 id="popup-title" class="section-title h5 m-0 pb-1 flex-grow-1 me-3">Форма обратной связи</h2>
        <button type="button" id="close-form" class="btn-close" aria-label="Закрыть"></button>
      </div>

      <form id="feedback-form" class="row g-2" action="https://formcarry.com/s/c6G3XdLo4DB" method="post">

        <div class="col-12">
          <label for="fio" class="form-label small fw-bold mb-1">ФИО</label>
          <input type="text" id="fio" name="fio" class="form-control form-control-sm"
                 placeholder="Мякинникова Эвелина Дмитриевна" autocomplete="name"
                 pattern="^[А-Яа-яЁёA-Za-z\s\-]+$"
                 title="Только буквы, пробелы и дефисы" required>
        </div>

        <div class="col-12 col-sm-6">
          <label for="email" class="form-label small fw-bold mb-1">E-mail</label>
          <input type="email" id="email" name="email" class="form-control form-control-sm"
                 placeholder="name@example.com" autocomplete="email" required>
        </div>

        <div class="col-12 col-sm-6">
          <label for="phone" class="form-label small fw-bold mb-1">Телефон</label>
          <input type="tel" id="phone" name="phone" class="form-control form-control-sm"
                 placeholder="+7 (900) 000-00-00" autocomplete="tel"
                 pattern="^[\d\s\(\)\+\-]+$"
                 title="Только цифры, пробелы, скобки, плюс и дефис" required>
        </div>

        <div class="col-12">
          <label for="organization" class="form-label small fw-bold mb-1">Организация</label>
          <input type="text" id="organization" name="organization" class="form-control form-control-sm"
                 placeholder="Необязательно" autocomplete="organization">
        </div>

        <div class="col-12">
          <label for="message" class="form-label small fw-bold mb-1">Сообщение</label>
          <textarea id="message" name="message" class="form-control form-control-sm"
                    rows="2" placeholder="Ваше сообщение" required></textarea>
        </div>

        <input type="text" name="_gotcha" class="d-none" tabindex="-1" autocomplete="off">

        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="consent" name="consent" value="yes" required>
            <label class="form-check-label small" for="consent">
              Я согласен(на) с
              <a class="contact-link" href="privacy.html" target="_blank" rel="noopener">политикой обработки персональных данных</a>
            </label>
          </div>
        </div>

        <div class="col-12">
          <div id="form-status" class="alert py-1 px-2 mb-2 small" role="status" hidden></div>
          <button type="submit" id="submit-button" class="btn btn-save px-4 py-1 w-100">Отправить</button>
        </div>

      </form>
    </div>
  </div>

  <footer class="site-footer text-center py-4 mt-3">
    <div class="container">
      <p class="m-0">&copy; eveliwz</p>
    </div>
  </footer>

</body>
</html>
